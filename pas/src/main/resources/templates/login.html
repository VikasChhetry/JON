<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h1>PAS</h1>
            <p class="subtitle">Project Approval System</p>
            
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            
            <form th:action="@{/login}" method="post" data-validate>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="username" class="form-control" placeholder="Enter your email" required autofocus>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn-login">Sign In</button>
            </form>
            
            <div class="mt-3 text-center">
                <a th:href="@{/forgot-password}" style="font-size: 14px; color: var(--primary);">Forgot Password?</a>
            </div>
            
            <div class="mt-4 text-center">
                <p class="text-muted" style="font-size: 13px;">
                    <i class="fas fa-info-circle"></i> Default admin: admin@pas.com / admin123
                </p>
            </div>
        </div>
    </div>
    
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
