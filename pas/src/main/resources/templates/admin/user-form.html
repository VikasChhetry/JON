<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: html(
          title=${isEdit ? 'Edit User' : 'Add User'},
          content=~{::main}
      )}">
<body>
    <main th:fragment="main">
        <div class="page-header">
            <h1 th:text="${isEdit ? 'Edit User' : 'Add User'}">User Form</h1>
            <p>Manage user account details</p>
        </div>
        
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="row">
            <div class="col-md-8">
                <div class="content-card">
                    <div class="card-body">
                        <form th:action="${isEdit ? '/admin/users/edit/' + user.id : '/admin/users/new'}" 
                              method="post" data-validate>
                            
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" name="fullName" class="form-control" th:value="${user?.fullName}" required>
                                </div>
                                <div class="col-md-6 form-group">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" name="email" class="form-control" th:value="${user?.email}" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label class="form-label">Role</label>
                                    <select name="role" class="form-control" required id="roleSelect">
                                        <option value="">Select Role...</option>
                                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                                th:selected="${user?.role == r}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6 form-group" id="branchGroup">
                                    <label class="form-label">Branch (Required for non-admin)</label>
                                    <select name="branchId" class="form-control" id="branchSelect">
                                        <option value="">Select Branch...</option>
                                        <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name + ' (' + b.code + ')'}"
                                                th:selected="${user?.branch != null and user.branch.id == b.id}"></option>
                                    </select>
                                </div>
                            </div>
                            
                            <div th:if="${!isEdit}" class="form-group mt-2">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            
                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary" th:text="${isEdit ? 'Update User' : 'Create User'}">Submit</button>
                                <a th:href="@{/admin/users}" class="btn btn-outline">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4" th:if="${isEdit}">
                <div class="content-card">
                    <div class="card-header">
                        <h2>Reset Password</h2>
                    </div>
                    <div class="card-body">
                        <form th:action="@{'/admin/users/' + ${user.id} + '/reset-password'}" method="post" data-validate>
                            <div class="form-group">
                                <label class="form-label">New Password</label>
                                <input type="password" name="newPassword" class="form-control" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-warning w-100">Reset Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // Client-side UI logic for role/branch dependency
            document.addEventListener('DOMContentLoaded', function() {
                const roleSelect = document.getElementById('roleSelect');
                const branchSelect = document.getElementById('branchSelect');
                
                function updateBranchReq() {
                    if (roleSelect.value === 'ADMIN') {
                        branchSelect.removeAttribute('required');
                        branchSelect.value = '';
                    } else {
                        branchSelect.setAttribute('required', 'required');
                    }
                }
                
                roleSelect.addEventListener('change', updateBranchReq);
                updateBranchReq(); // Initial state
            });
        </script>
    </main>
</body>
</html>
