<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h1>PAS</h1>
            <p class="subtitle">Reset Password</p>
            
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            
            <!-- Success State -->
            <div th:if="${successEmail != null}" class="text-center" style="padding: 10px 0;">
                <div style="font-size: 48px; color: #10b981; margin-bottom: 15px; text-align: center;">✓</div>
                <h2 style="margin-bottom: 15px; font-size: 24px; color: var(--text-color); text-align: center;">Reset Link Sent!</h2>
                <p style="color: var(--text-muted); margin-bottom: 10px; text-align: center;">
                    We've sent a password reset link to your email address:
                </p>
                <p style="font-weight: 600; margin-bottom: 15px; color: var(--primary-color); text-align: center;" th:text="${successEmail}"></p>
                <p style="color: var(--text-muted); margin-bottom: 25px; font-size: 14px; text-align: center;">
                    Please check your inbox and spam folder.
                </p>
                
                <a th:href="@{/login}" class="btn-login" style="text-decoration: none; display: block; margin-bottom: 15px; text-align: center; box-sizing: border-box; width: 100%;">Back to Login</a>
                
                <div class="text-center" style="text-align: center;">
                    <a th:href="@{/forgot-password}" style="font-size: 14px; color: var(--text-muted);">Send Again</a>
                </div>
            </div>

            <!-- Default Form State -->
            <div th:if="${successEmail == null}">
                <p style="font-size: 14px; text-align: center; margin-bottom: 20px; color: var(--text-muted);">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
                
                <form th:action="@{/forgot-password}" method="post" data-validate>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required autofocus>
                    </div>
                    
                    <button type="submit" class="btn-login" style="margin-bottom: 15px;">Send Reset Link</button>
                    
                    <div class="text-center">
                        <a th:href="@{/login}" style="font-size: 14px; color: var(--text-muted);">Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
