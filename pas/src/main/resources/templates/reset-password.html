<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset Password')}"></head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h1>PAS</h1>
            <p class="subtitle">Set New Password</p>
            
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            
            <form th:action="@{/reset-password}" method="post" data-validate>
                <input type="hidden" name="token" th:value="${token}" />
                
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter new password" required minlength="6" autofocus>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirmPassword" class="form-control" placeholder="Confirm new password" required minlength="6">
                </div>
                
                <button type="submit" class="btn-login" style="margin-bottom: 15px;">Reset Password</button>
                
                <div class="text-center">
                    <a th:href="@{/login}" style="font-size: 14px; color: var(--text-muted);">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
    
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
