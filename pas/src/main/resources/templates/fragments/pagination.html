<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 
    Reusable Pagination Controls
    Usage:
    <div th:replace="~{fragments/pagination :: controls(page=${page})}"></div>
-->
<div th:fragment="controls(page)" th:if="${page != null and page.totalPages > 1}"
    class="d-flex justify-content-between align-items-center mt-4">
    <div class="text-muted small">
        Showing <span th:text="${page.number * page.size + 1}"></span> to
        <span th:text="${page.isLast() ? page.totalElements : (page.number + 1) * page.size}"></span> of
        <span th:text="${page.totalElements}"></span> entries
    </div>

    <nav aria-label="Page navigation">
        <ul class="pagination pagination-sm mb-0">
            <!-- First and Previous -->
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                    th:href="@{${#httpServletRequest.requestURI}(page=0, size=${page.size}, keyword=${param.keyword}, status=${param.status}, role=${param.role}, sort=${param.sort})}"
                    title="First Page">
                    <i class="fas fa-angle-double-left"></i>
                </a>
            </li>
            <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
                <a class="page-link"
                    th:href="@{${#httpServletRequest.requestURI}(page=${page.number - 1}, size=${page.size}, keyword=${param.keyword}, status=${param.status}, role=${param.role}, sort=${param.sort})}"
                    title="Previous Page">
                    <i class="fas fa-angle-left"></i>
                </a>
            </li>

            <!-- Page Numbers -->
            <li class="page-item" th:each="i : ${page.totalPages > 0 ? #numbers.sequence(
                                      T(java.lang.Math).max(0, page.number - 2),
                                      T(java.lang.Math).min(page.totalPages - 1, page.number + 2)) : {0}}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link" th:text="${i + 1}"
                    th:href="@{${#httpServletRequest.requestURI}(page=${i}, size=${page.size}, keyword=${param.keyword}, status=${param.status}, role=${param.role}, sort=${param.sort})}">
                </a>
            </li>

            <!-- Next and Last -->
            <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
                <a class="page-link"
                    th:href="@{${#httpServletRequest.requestURI}(page=${page.number + 1}, size=${page.size}, keyword=${param.keyword}, status=${param.status}, role=${param.role}, sort=${param.sort})}"
                    title="Next Page">
                    <i class="fas fa-angle-right"></i>
                </a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                    th:href="@{${#httpServletRequest.requestURI}(page=${page.totalPages - 1}, size=${page.size}, keyword=${param.keyword}, status=${param.status}, role=${param.role}, sort=${param.sort})}"
                    title="Last Page">
                    <i class="fas fa-angle-double-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>
<!-- Empty records message -->
<div th:fragment="empty(page, message)" th:if="${page != null and page.totalElements == 0}"
    class="text-center py-5 text-muted">
    <i class="fas fa-search fs-1 d-block mb-3 opacity-50"></i>
    <span th:text="${message}">No records found matching your search or filters.</span>
</div>

</html>
