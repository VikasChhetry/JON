<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Project Approval System'">PAS</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body th:fragment="body(content)">

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">
                    <i class="fas fa-project-diagram"></i>
                </div>
                <div>
                    <div class="brand-text">PAS</div>
                    <div class="brand-sub">Project Approval System</div>
                </div>
                <button class="btn d-md-none ms-auto text-light" id="sidebarToggleBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <!-- Admin Navigation -->
                <div th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}">
                    <div class="nav-section-title">Administration</div>
                    <a th:href="@{/admin/dashboard}" class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/admin/dashboard')} ? 'active'">
                        <i class="fas fa-home nav-icon"></i> Dashboard
                    </a>
                    <a th:href="@{/admin/branches}" class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/admin/branches')} ? 'active'">
                        <i class="fas fa-code-branch nav-icon"></i> Branches
                    </a>
                    <a th:href="@{/admin/users}" class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/admin/users')} ? 'active'">
                        <i class="fas fa-users nav-icon"></i> Users
                    </a>
                </div>

                <!-- Student Navigation -->
                <div th:if="${#authorization.expression('hasRole(''ROLE_STUDENT'')')}">
                    <div class="nav-section-title">My Space</div>
                    <a th:href="@{/student/dashboard}" class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/student/dashboard')} ? 'active'">
                        <i class="fas fa-home nav-icon"></i> Dashboard
                    </a>
                    
                    <div class="nav-section-title">Actions</div>
                    <a th:href="@{/student/project/new}" class="nav-link" th:classappend="${requestURI == '/student/project/new'} ? 'active'">
                        <i class="fas fa-lightbulb nav-icon"></i> Propose Idea
                    </a>
                    <a th:href="@{/student/topics}" class="nav-link" th:classappend="${requestURI == '/student/topics'} ? 'active'">
                        <i class="fas fa-list nav-icon"></i> Browse Topics
                    </a>
                    <a th:href="@{/student/guide-selection}" class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/student/guide-selection')} ? 'active'">
                        <i class="fas fa-user-tie nav-icon"></i> Select Guide
                    </a>
                </div>

                <!-- Faculty Navigation -->
                <div th:if="${#authorization.expression('hasRole(''ROLE_FACULTY'')')}">
                    <div class="nav-section-title">Dashboard</div>
                    <a th:href="@{/faculty/dashboard}" class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/faculty/dashboard')} ? 'active'">
                        <i class="fas fa-home nav-icon"></i> Overview
                    </a>
                    
                    <div class="nav-section-title">Management</div>
                    <a th:href="@{/faculty/projects}" class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/faculty/projects')} ? 'active'">
                        <i class="fas fa-tasks nav-icon"></i> Projects
                    </a>
                    <a th:href="@{/faculty/topics}" class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/faculty/topics')} ? 'active'">
                        <i class="fas fa-book nav-icon"></i> Topics
                    </a>
                    <a th:href="@{/faculty/my-students}" class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/faculty/my-students')} ? 'active'">
                        <i class="fas fa-user-graduate nav-icon"></i> My Students
                    </a>
                </div>

                <!-- HOD Navigation -->
                <div th:if="${#authorization.expression('hasRole(''ROLE_HOD'')')}">
                    <div class="nav-section-title">Department</div>
                    <a th:href="@{/hod/dashboard}" class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/hod/dashboard')} ? 'active'">
                        <i class="fas fa-home nav-icon"></i> Overview
                    </a>
                    
                    <div class="nav-section-title">Management</div>
                    <a th:href="@{/hod/projects}" class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/hod/projects')} ? 'active'">
                        <i class="fas fa-tasks nav-icon"></i> Branch Projects
                    </a>
                    <a th:href="@{/hod/topics}" class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/hod/topics')} ? 'active'">
                        <i class="fas fa-book nav-icon"></i> Topic Repository
                    </a>
                    <a th:href="@{/hod/guide-selection}" class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/hod/guide-selection')} ? 'active'">
                        <i class="fas fa-user-tie nav-icon"></i> Guide Selection
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div>
                        <div class="user-name" th:text="${#authentication.principal.username}">User</div>
                        <div class="user-role" th:text="${#strings.replace(#authentication.principal.authorities[0].authority, 'ROLE_', '')}">ROLE</div>
                    </div>
                </div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </form>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Mobile Header -->
            <div class="d-md-none d-flex align-items-center mb-4">
                <button class="btn btn-outline" id="sidebarToggle" style="margin-right: 15px;">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="brand-text fs-4 fw-bold">PAS</div>
            </div>

            <!-- Inject actual page content here -->
            <div th:replace="${content}"></div>
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
