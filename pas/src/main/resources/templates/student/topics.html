<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: html(
          title='Browse Topics',
          content=~{::main}
      )}">
<body>
    <main th:fragment="main">
        <div class="page-header">
            <h1>Available Topics</h1>
            <p>Select a pre-approved project topic provided by your branch faculty</p>
        </div>
        
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div th:if="${#lists.isEmpty(topics)}" class="empty-state">
            <i class="fas fa-folder-open empty-icon"></i>
            <h3>No Topics Available</h3>
            <p>There are currently no available topics for the <span th:text="${student.branch.code}"></span> branch. Please check back later or propose your own idea.</p>
        </div>

        <div class="topic-grid">
            <div th:each="topic : ${topics}" class="topic-card d-flex flex-column">
                <h3 th:text="${topic.title}">Topic Title</h3>
                
                <div class="topic-tags">
                    <span class="topic-tag" th:if="${!#strings.isEmpty(topic.category)}" th:text="${topic.category}">Category</span>
                    <span class="topic-tag" th:if="${!#strings.isEmpty(topic.techStack)}" th:text="${topic.techStack}">Tech</span>
                </div>
                
                <p class="flex-grow-1" th:text="${topic.description}">Description</p>
                
                <div class="mt-3 pt-3 border-top border-secondary border-opacity-25 d-flex justify-content-between align-items-center">
                    <small class="text-muted">By <span th:text="${topic.createdBy.fullName}">Name</span></small>
                    
                    <form th:id="'select-topic-' + ${topic.id}" th:action="@{'/student/topics/' + ${topic.id} + '/select'}" method="post">
                        <button type="button" class="btn btn-sm btn-primary" th:onclick="'confirmSelectTopic(\'select-topic-' + ${topic.id} + '\')'">
                            Select Topic
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
