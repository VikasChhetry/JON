<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html(
          title='Browse Topics',
          content=~{::main}
      )}">

<body>
    <main th:fragment="main">
        <div class="page-header">
            <h1>Available Topics</h1>
            <p>Select a pre-approved project topic provided by your branch faculty</p>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div th:replace="~{fragments/search-filter :: toolbar(
            actionUrl=@{/student/topics},
            searchPlaceholder='Search topics by title, category, or tech stack...',
            showStatusFilter=false, statusOptions=null,
            showRoleFilter=false, roleOptions=null,
            showSort=true, sortOptions=null
        )}"></div>

        <div th:if="${page.empty}" class="empty-state">
            <div
                th:replace="~{fragments/pagination :: empty(page=${page}, message='No topics available or matching your search criteria.')}">
            </div>
        </div>

        <div class="topic-grid">
            <div th:each="topic : ${page.content}" class="topic-card d-flex flex-column">
                <h3 th:text="${topic.title}">Topic Title</h3>

                <div class="topic-tags">
                    <span class="topic-tag" th:if="${!#strings.isEmpty(topic.category)}"
                        th:text="${topic.category}">Category</span>
                    <span class="topic-tag" th:if="${!#strings.isEmpty(topic.techStack)}"
                        th:text="${topic.techStack}">Tech</span>
                    <span class="topic-tag bg-secondary text-white"><i class="fas fa-users me-1"></i> <span
                            th:text="${topic.minTeamSize}"></span> - <span th:text="${topic.maxTeamSize}"></span></span>
                </div>

                <p class="flex-grow-1" th:text="${topic.description}">Description</p>

                <div
                    class="mt-3 pt-3 border-top border-secondary border-opacity-25 d-flex justify-content-between align-items-center">
                    <small class="text-muted">By <span th:text="${topic.createdBy.fullName}">Name</span></small>

                    <form th:id="'select-topic-' + ${topic.id}"
                        th:action="@{'/student/topics/' + ${topic.id} + '/select'}" method="post">
                        <button type="button" class="btn btn-sm btn-primary"
                            th:onclick="'confirmSelectTopic(\'select-topic-' + ${topic.id} + '\')'">
                            Select Topic
                        </button>
                    </form>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/pagination :: controls(page=${page})}"></div>
    </main>
</body>

</html>
