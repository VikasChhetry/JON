<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html(
          title='My Profile',
          content=~{::main}
      )}">

<body>
    <main th:fragment="main">
        <div class="page-header">
            <h1><i class="fas fa-user-circle me-2"></i>My Profile</h1>
            <p>View and manage your account details</p>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="row">
            <!-- Profile Details Card -->
            <div class="col-lg-8">
                <div class="content-card mb-4">
                    <div class="card-header">
                        <h2><i class="fas fa-id-card me-2 text-primary"></i>Profile Details</h2>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/profile}" method="post" data-validate>
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" name="fullName" class="form-control" th:value="${user.fullName}"
                                        required>
                                </div>
                                <div class="col-md-6 form-group">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" class="form-control" th:value="${user.email}" disabled readonly>
                                    <small class="text-muted">Email cannot be changed</small>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label class="form-label">ERP ID</label>
                                    <input type="text" name="erpId" class="form-control" th:value="${user.erpId}"
                                        placeholder="Enter your ERP ID">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label class="form-label">Roll Number</label>
                                    <input type="text" name="rollNumber" class="form-control"
                                        th:value="${user.rollNumber}" placeholder="Enter your Roll Number">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label class="form-label">Role</label>
                                    <input type="text" class="form-control" th:value="${user.role.name()}" disabled
                                        readonly>
                                    <small class="text-muted">Role cannot be changed</small>
                                </div>
                                <div class="col-md-6 form-group">
                                    <label class="form-label">Branch</label>
                                    <input type="text" class="form-control"
                                        th:value="${user.branch != null ? user.branch.name + ' (' + user.branch.code + ')' : 'N/A'}"
                                        disabled readonly>
                                    <small class="text-muted">Branch cannot be changed</small>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i> Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Sidebar: Account Info + Change Password -->
            <div class="col-lg-4">
                <!-- Account Summary -->
                <div class="content-card mb-4">
                    <div class="card-header">
                        <h2><i class="fas fa-info-circle me-2 text-info"></i>Account Info</h2>
                    </div>
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-center mb-3">
                            <div class="rounded-circle d-flex align-items-center justify-content-center"
                                style="width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), var(--accent)); font-size: 2rem;">
                                <i class="fas fa-user text-white"></i>
                            </div>
                        </div>
                        <h5 class="text-center mb-1" th:text="${user.fullName}">Name</h5>
                        <p class="text-center text-muted mb-3" th:text="${user.email}">email</p>
                        <div class="text-center">
                            <span class="badge" th:classappend="${user.role.name() == 'ADMIN' ? 'bg-danger' : 
                                  (user.role.name() == 'STUDENT' ? 'bg-info' : 
                                  (user.role.name() == 'FACULTY' ? 'bg-success' : 'bg-warning'))}"
                                th:text="${user.role.name()}" style="font-size: 0.85rem;">ROLE</span>
                            <span th:if="${user.branch != null}" class="badge bg-secondary ms-1"
                                th:text="${user.branch.code}" style="font-size: 0.85rem;">BRANCH</span>
                        </div>
                        <hr class="border-secondary border-opacity-25">
                        <div class="small">
                            <div class="d-flex justify-content-between mb-1">
                                <span class="text-muted">ERP ID:</span>
                                <span
                                    th:text="${user.erpId != null && !user.erpId.isEmpty() ? user.erpId : 'Not set'}">-</span>
                            </div>
                            <div class="d-flex justify-content-between mb-1">
                                <span class="text-muted">Roll Number:</span>
                                <span
                                    th:text="${user.rollNumber != null && !user.rollNumber.isEmpty() ? user.rollNumber : 'Not set'}">-</span>
                            </div>
                            <div class="d-flex justify-content-between mb-1">
                                <span class="text-muted">Status:</span>
                                <span class="badge" th:classappend="${user.enabled ? 'bg-success' : 'bg-secondary'}"
                                    th:text="${user.enabled ? 'Active' : 'Disabled'}">Status</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Change Password -->
                <div class="content-card">
                    <div class="card-header">
                        <h2><i class="fas fa-lock me-2 text-warning"></i>Change Password</h2>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/profile/change-password}" method="post" data-validate>
                            <div class="form-group">
                                <label class="form-label">Current Password</label>
                                <input type="password" name="currentPassword" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">New Password</label>
                                <input type="password" name="newPassword" class="form-control" required minlength="6">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Confirm New Password</label>
                                <input type="password" name="confirmPassword" class="form-control" required
                                    minlength="6">
                            </div>
                            <button type="submit" class="btn btn-warning w-100">
                                <i class="fas fa-key me-1"></i> Change Password
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
