
spring.datasource.url=jdbc:mysql://localhost:3306/jon
spring.datasource.username=root
spring.datasource.password=Vikas@6948

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads
server.error.whitelabel.enabled=false

# Gmail SMTP Configuration (set MAIL_USERNAME and MAIL_PASSWORD as environment variables)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application base URL for password reset links
app.base-url=http://localhost:8080

# Enable debug logging for JavaMail to see exact SMTP traffic and errors
spring.mail.properties.mail.debug=true